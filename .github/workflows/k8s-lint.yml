name: 'K8s Manifest Validation'

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  validate-yaml:
    name: 'Lint Kubernetes Manifests'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Validate Kubernetes YAML Syntax
      run: |
        python3 -c "import yaml, glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('*.yaml')]"